# dsh-source-control bundle patch.
#
# This file is the `dsh.bundle.patch` layer of the package: installing through
# the official CLI —
#
#   dsh plugin --profile web add dsh-source-control
#
# — reconciles `dsh.profile.bundles` against installed packages and, seeing this
# declaration, appends the row below to the composed tree. The node half
# (exports ".") runs in the host process and owns the `/dsh-source-control/*`
# git route; the `dsh.client` manifest in package.json makes the browser half
# (exports "./client") load in the Web GUI, where it registers the
# "源代码管理" tab type in the native right sidebar.
#
# Optional configuration:
#
#   - insert:
#       - id: source-control
#         name: 'dsh-source-control'
#         config:
#           recentCommits: 20
#           pollMs: 5000
#           defaultRemote: origin
- insert:
    - id: source-control
      name: 'dsh-source-control'
